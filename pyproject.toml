[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lookagain"
version = "0.1.0"
description = "LookAgain: VLM Reliability Auditor -- test if your VLM truly relies on visual evidence."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "LookAgain Contributors" }
]
keywords = [
    "vlm",
    "multimodal",
    "reliability",
    "audit",
    "vision-language",
    "hallucination",
    "testing",
    "benchmark",
    "evaluation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Operating System :: OS Independent",
]
dependencies = [
    "openai>=1.0",
    "Pillow>=10.0",
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/Fengrru/lookagain"
Documentation = "https://github.com/Fengrru/lookagain#readme"
Repository = "https://github.com/Fengrru/lookagain"
Issues = "https://github.com/Fengrru/lookagain/issues"
Changelog = "https://github.com/Fengrru/lookagain/blob/main/CHANGELOG.md"

[project.optional-dependencies]
anthropic = ["anthropic>=0.30.0"]
gemini = ["google-generativeai>=0.7.0"]
all = [
    "anthropic>=0.30.0",
    "google-generativeai>=0.7.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.5.0",
]

[project.scripts]
lookagain = "lookagain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lookagain", "lookagain.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
