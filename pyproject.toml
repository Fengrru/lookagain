[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirage-audit"
version = "0.1.0"
description = "Mirage Audit: VLM Reliability Auditor — test if your VLM truly relies on visual evidence."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Mirage Contributors" }
]
keywords = [
    "vlm",
    "multimodal",
    "reliability",
    "audit",
    "vision-language",
    "hallucination",
    "testing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "openai>=1.0",
    "Pillow>=10.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.30.0"]
gemini = ["google-generativeai>=0.7.0"]
all = [
    "anthropic>=0.30.0",
    "google-generativeai>=0.7.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.5.0",
]

[project.scripts]
mirage = "mirage_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mirage_audit", "mirage_audit.*"]
